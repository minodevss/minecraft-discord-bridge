name: MinecraftDiscordBridge
version: '${version}'
main: com.minecraftdiscordbridge.paper.PaperPlugin
api-version: '1.21'
folia-supported: true
description: Minecraft ↔ Discord bridge
website: https://github.com/minodevss/minecraft-discord-bridge
softdepend: [LuckPerms, floodgate]
permissions:
  minecraftdiscordbridge.command.link:
    description: Get a code to link your Discord account, or unlink it
    default: true
  minecraftdiscordbridge.command.toggle:
    description: Hide or show messages from Discord for yourself
    default: true
  minecraftdiscordbridge.command.status:
    description: Show the Discord connection, queues and linked accounts
    default: op
  minecraftdiscordbridge.command.reload:
    description: Reload config.yml and secrets.yml
    default: op
  minecraftdiscordbridge.command.setup:
    description: Get a one-time code for /setup in Discord (console only)
    default: op
  minecraftdiscordbridge.gate.bypass:
    description: Join without the linked Discord account or role the join gate asks for
    default: op
