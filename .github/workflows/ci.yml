name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_JAVA17: itzg/minecraft-server:2026.9.2-java17@sha256:0198cb9f0c7e7b1747645040e1245a6915c122662f3106f3b0979473a953ab61
  SERVER_JAVA21: itzg/minecraft-server:2026.9.2-java21@sha256:edf50d431ddc6f73929368e82f4334a405796874f7b0ae11f1edcbb267d670aa
  SERVER_JAVA25: itzg/minecraft-server:2026.9.2-java25@sha256:de5d1b1a83eba576f6c8a688fac2a3523ce457724cdebc8ea48d7818b74cdf6e
  PROXY_JAVA21: itzg/mc-proxy:2026.10.0-java21@sha256:17b47f3a7f10c647b2db8b42aa55e4fc8c9af5565a9fc2a139f493df19eed813
  PROXY_JAVA25: itzg/mc-proxy:2026.10.0-java25@sha256:ad35279fe06ec23ad0a2b8980894490177c6121eefb8784e5e5d8912aa6cbc07

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build -Pnodes=all
      - run: .github/scripts/check-third-party-notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: |
            paper/build/libs/minecraft-discord-bridge-*.jar
            velocity/build/libs/minecraft-discord-bridge-*.jar
            modded/versions/*/build/libs/minecraft-discord-bridge-*.jar
            !**/*-slim.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: paper 1.21, image: SERVER_JAVA21, type: PAPER, version: "1.21", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: paper 1.21.11, image: SERVER_JAVA21, type: PAPER, version: "1.21.11", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: paper 26.3, image: SERVER_JAVA25, type: PAPER, version: "26.3", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: folia 26.2, image: SERVER_JAVA25, type: FOLIA, version: "26.2", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: purpur 26.3, image: SERVER_JAVA25, type: PURPUR, version: "26.3", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: leaf 26.2, image: SERVER_JAVA25, type: LEAF, version: "26.2", mount: /plugins, jar: "minecraft-discord-bridge-paper-*.jar" }
          - { name: fabric 26.1.2, image: SERVER_JAVA25, type: FABRIC, version: "26.1.2", mount: /mods, jar: "minecraft-discord-bridge-fabric-*+26.1.2.jar", env: "MODRINTH_PROJECTS=fabric-api" }
          - { name: fabric 26.3 with the 26.1.2 jar, image: SERVER_JAVA25, type: FABRIC, version: "26.3", mount: /mods, jar: "minecraft-discord-bridge-fabric-*+26.1.2.jar", env: "MODRINTH_PROJECTS=fabric-api" }
          - { name: fabric 1.21.11, image: SERVER_JAVA21, type: FABRIC, version: "1.21.11", mount: /mods, jar: "minecraft-discord-bridge-fabric-*+1.21.11.jar", env: "MODRINTH_PROJECTS=fabric-api" }
          - { name: fabric 1.21.1, image: SERVER_JAVA21, type: FABRIC, version: "1.21.1", mount: /mods, jar: "minecraft-discord-bridge-fabric-*+1.21.1.jar", env: "MODRINTH_PROJECTS=fabric-api" }
          - { name: fabric 1.20.1, image: SERVER_JAVA17, type: FABRIC, version: "1.20.1", mount: /mods, jar: "minecraft-discord-bridge-fabric-*+1.20.1.jar", env: "MODRINTH_PROJECTS=fabric-api" }
          - { name: neoforge 26.2, image: SERVER_JAVA25, type: NEOFORGE, version: "26.2", mount: /mods, jar: "minecraft-discord-bridge-neoforge-*+26.2.jar" }
          - { name: neoforge 26.3 beta with the 26.2 jar, image: SERVER_JAVA25, type: NEOFORGE, version: "26.3", mount: /mods, jar: "minecraft-discord-bridge-neoforge-*+26.2.jar", env: "NEOFORGE_VERSION=beta" }
          - { name: neoforge 1.21.1, image: SERVER_JAVA21, type: NEOFORGE, version: "1.21.1", mount: /mods, jar: "minecraft-discord-bridge-neoforge-*+1.21.1.jar" }
          - { name: forge 1.20.1, image: SERVER_JAVA17, type: FORGE, version: "1.20.1", mount: /mods, jar: "minecraft-discord-bridge-forge-*+1.20.1.jar" }
          - { name: velocity 3.4.0, image: PROXY_JAVA21, type: VELOCITY, mount: /plugins, jar: "minecraft-discord-bridge-velocity-*.jar", env: "VELOCITY_VERSION=3.4.0" }
          - { name: velocity 4.2.0, image: PROXY_JAVA25, type: VELOCITY, mount: /plugins, jar: "minecraft-discord-bridge-velocity-*.jar", env: "VELOCITY_VERSION=4.2.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: jars
      - run: .github/scripts/smoke.sh
        env:
          IMAGE: ${{ env[matrix.image] }}
          TYPE: ${{ matrix.type }}
          VERSION: ${{ matrix.version }}
          MOUNT: ${{ matrix.mount }}
          JAR: ${{ matrix.jar }}
          SERVER_ENV: ${{ matrix.env }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log-${{ strategy.job-index }}
          path: server.log
          if-no-files-found: ignore
