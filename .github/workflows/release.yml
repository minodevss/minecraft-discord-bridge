name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, such as v1.2.3
        required: true
        type: string
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      HANGAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check that the tag matches gradle.properties
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match version=$version in gradle.properties."
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - run: ./gradlew build -Pnodes=all
      - name: Collect the jars
        run: |
          version=${TAG#v}
          mkdir dist
          cp "paper/build/libs/minecraft-discord-bridge-paper-$version.jar" \
            "velocity/build/libs/minecraft-discord-bridge-velocity-$version.jar" dist/
          for node in modded/versions/*/; do
            name=$(basename "$node")
            cp "${node}build/libs/minecraft-discord-bridge-${name##*-}-$version+${name%-*}.jar" dist/
          done
          (cd dist && sha256sum -- *.jar > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.jar

  github-release:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the GitHub release
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [[ "$draft" != true ]]; then
              echo "::error::Release $TAG is already published. Published releases are immutable; release a new version instead."
              exit 1
            fi
            gh release upload "$TAG" dist/*
            gh release edit "$TAG" --draft=false "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi

  publish:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" --json body --jq .body > dist/notes.md
      - name: Publish to Modrinth, CurseForge and Hangar
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
        run: >-
          ./gradlew :publishMods :publishAllPublicationsToHangar
          -Ppublish.changelog=dist/notes.md --no-configuration-cache
