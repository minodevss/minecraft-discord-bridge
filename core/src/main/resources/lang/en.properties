status.login-failed=Could not log in to Discord ({0}). The bridge keeps trying
status.disconnected=Discord ended the connection ({0}). Check the bot in the Discord Developer Portal and run /discord reload
status.message-content-off=The Message Content intent is off, so Discord messages reach Minecraft empty. Turn it on at {0} and run /discord reload
